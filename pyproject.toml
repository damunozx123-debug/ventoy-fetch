[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ventoy-fetch"
version = "7.0.1"
description = "Download and verify ISO images for Ventoy from Android Termux"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.scripts]
ventoy-fetch = "ventoy_fetch:main"

[tool.setuptools]
py-modules = ["ventoy_fetch"]
